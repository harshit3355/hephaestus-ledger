[project]
name = "hephaestus-ledger"
version = "0.1.0"
description = "Attested AI deployment provenance graph: is the live image + model config + Terraform state + policy + workload identity reachable from one approved release root?"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
